name: Build QEMU (DF4D3110/qemu)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-arm64:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM64 原生动态构建
          - os: windows-11-arm
            sys: clangarm64
            arch: clang-aarch64
            mode: dynamic
            extra_conf: '--enable-gtk'
            extra_cflags: ''
            disable_libnfs: ''
          # ARM64 原生静态构建
          - os: windows-11-arm
            sys: clangarm64
            arch: clang-aarch64
            mode: static
            extra_conf: '--disable-gtk --disable-spice --disable-usb-redir --disable-smartcard --disable-gnutls --disable-libssh --disable-vnc-sasl --static'
            extra_cflags: '-DCURL_STATICLIB -DLIBSSH_STATIC -DLIBSLIRP_STATIC -DCAIRO_WIN32_STATIC_BUILD'
            disable_libnfs: '--disable-libnfs'
    runs-on: ${{ matrix.os }}
    env:
      clang_extra_cflags: '-Wno-missing-prototypes -Wno-sometimes-uninitialized -Wno-pragma-pack'

    name: ${{ format('🚧 Windows {0} {1} build (ARM64)', matrix.sys, matrix.mode) }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        repository: DF4D3110/qemu
        ref: master

    - name: 'Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p
          python-distlib:p
          nsis:c

    # 安装正确的 MinGW Python 和 Meson
    - name: 'Install MinGW Python and Meson'
      run: |
        pacman --noconfirm -S \
          mingw-w64-${{ matrix.arch }}-python \
          mingw-w64-${{ matrix.arch }}-meson \
          mingw-w64-${{ matrix.arch }}-python-packaging

    # 创建 Clang 包装脚本
    - name: 'Setup compiler wrapper for clangarm64'
      if: ${{ startsWith(matrix.sys, 'clang') }}
      run: |
        mkdir -p /${{ matrix.sys }}/bin/wrapper
        cat > /${{ matrix.sys }}/bin/wrapper/clang << 'EOF'
        #!/bin/sh
        exec /${{ matrix.sys }}/bin/clang.exe -target aarch64-w64-windows-gnu "$@"
        EOF
        chmod +x /${{ matrix.sys }}/bin/wrapper/clang
        cat > /${{ matrix.sys }}/bin/wrapper/clang++ << 'EOF'
        #!/bin/sh
        exec /${{ matrix.sys }}/bin/clang++.exe -target aarch64-w64-windows-gnu "$@"
        EOF
        chmod +x /${{ matrix.sys }}/bin/wrapper/clang++
        echo "PATH=/${{ matrix.sys }}/bin/wrapper:/${{ matrix.sys }}/bin:\$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV

    - name: 'Modify pkgconfig to avoid linker issues'
      if: ${{ matrix.mode == 'static' }}
      run: |
        PKGCONFIG_FILE="/${{ matrix.sys }}/lib/pkgconfig/gpg-error.pc"
        if [ -f "$PKGCONFIG_FILE" ]; then
          sed -i "s#/${{ matrix.sys }}/lib/libintl.dll.a#-llibintl#g" "$PKGCONFIG_FILE"
          sed -i "s#/${{ matrix.sys }}/lib/libiconv.dll.a#-llibiconv#g" "$PKGCONFIG_FILE"
        fi

    - name: 'Verify environment'
      run: |
        echo "=========================================="
        echo "🔍 验证环境"
        echo "=========================================="
        echo ""
        echo "📌 Python 版本:"
        python3 --version
        echo ""
        echo "📌 Meson 版本:"
        meson --version
        echo ""
        echo "📌 Ninja 版本:"
        ninja --version
        echo ""
        echo "📌 编译器信息:"
        which clang || echo "clang not found"
        clang --version 2>/dev/null || echo "clang failed"
        echo ""
        echo "📌 测试编译:"
        echo 'int main(){return 0;}' > test.c
        clang test.c -o test.exe 2>&1 && echo "✅ Compilation works" || echo "❌ Compilation failed"
        file test.exe 2>/dev/null || echo "file command not available"
        echo ""
        echo "📌 环境变量:"
        echo "CC=$CC"
        echo "CXX=$CXX"
        echo "PATH=$PATH"
        echo ""
        echo "✅ 环境验证完成"

    - name: 'Configure QEMU (${{ matrix.mode }} build)'
      run: |
        # 构建 extra_cflags
        EXTRA_CFLAGS="${{ matrix.extra_cflags }}"
        if [[ "${{ matrix.sys }}" == clang* ]]; then
          EXTRA_CFLAGS="$EXTRA_CFLAGS ${{ env.clang_extra_cflags }}"
        fi
        if [[ "${{ matrix.sys }}" == clang* ]]; then
          EXTRA_CFLAGS="$EXTRA_CFLAGS -target aarch64-w64-windows-gnu"
        fi
        
        CONFIGURE_CMD="./configure --enable-sdl \
                    --enable-fdt=system \
                    --disable-docs \
                    --target-list=arm-softmmu,aarch64-softmmu \
                    --prefix=\"$(cygpath -u '${{ github.workspace }}')/artifacts\" \
                    ${{ matrix.extra_conf }} \
                    ${{ matrix.disable_libnfs }}"
        
        if [ -n "$EXTRA_CFLAGS" ]; then
          CONFIGURE_CMD="$CONFIGURE_CMD --extra-cflags=\"$EXTRA_CFLAGS\""
        fi
        
        if [[ "${{ matrix.sys }}" == clang* ]]; then
          CONFIGURE_CMD="$CONFIGURE_CMD --cc=clang --cxx=clang++"
        fi
        
        echo "Running: $CONFIGURE_CMD"
        eval $CONFIGURE_CMD

    - name: 'Build QEMU'
      run: |
        make -j$(nproc)
        echo "version=v$(cat VERSION)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: 'Workaround for clangarm64 nsis'
      if: ${{ startsWith(matrix.sys, 'clang') && matrix.mode == 'dynamic' }}
      run: |
        if [ ! -d "/${{ matrix.sys }}/share/nsis" ] && [ -d "/clang64/share/nsis" ]; then
          ln -s /clang64/share/nsis /${{ matrix.sys }}/share/nsis 2>/dev/null || true
        fi
        if [ ! -f "/${{ matrix.sys }}/etc/nsisconf.nsh" ] && [ -f "/clang64/etc/nsisconf.nsh" ]; then
          ln -s /clang64/etc/nsisconf.nsh /${{ matrix.sys }}/etc/nsisconf.nsh 2>/dev/null || true
        fi
        if [ ! -f "/${{ matrix.sys }}/bin/makensis.exe" ] && [ -f "/clang64/bin/makensis.exe" ]; then
          ln -s /clang64/bin/makensis.exe /${{ matrix.sys }}/bin/makensis.exe 2>/dev/null || true
        fi
        chmod +x /${{ matrix.sys }}/bin/makensis.exe 2>/dev/null || true

    - name: 'Prepare artifacts (static)'
      if: ${{ matrix.mode == 'static' }}
      run: |
        make install

    - name: 'Prepare artifacts (dynamic)'
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
        make installer
        mv -v build/qemu-setup*.exe qemu-setup-${version}.exe

    - name: 'Upload artifact (dynamic)'
      if: ${{ matrix.mode == 'dynamic' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('QEMU {0} Windows ARM64 ({1} build)', env.version, matrix.mode) }}
        path: ${{ github.workspace }}/qemu-setup-${{ env.version }}.exe
        compression-level: 9

    - name: 'Upload artifact (static)'
      if: ${{ matrix.mode == 'static' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('QEMU {0} Windows ARM64 ({1} build)', env.version, matrix.mode) }}
        path: ${{ github.workspace }}/artifacts
        compression-level: 9

    - name: 'Upload logs'
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('QEMU {0} Windows ARM64 ({1} build) logs', env.version, matrix.mode) }}
        path: ${{ github.workspace }}/build
        compression-level: 9

name: Build QEMU (DF4D3110/qemu)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-arm64:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM64 原生动态构建
          - os: windows-11-arm
            sys: clangarm64
            arch: clang-aarch64
            mode: dynamic
          # ARM64 原生静态构建
          - os: windows-11-arm
            sys: clangarm64
            arch: clang-aarch64
            mode: static
    runs-on: ${{ matrix.os }}
    env:
      dynamic_flags: '--enable-gtk'
      static_flags: '--disable-gtk --disable-spice --disable-usb-redir --disable-smartcard --disable-gnutls --disable-libssh --disable-vnc-sasl --static'
      static_extra_cflags: '-DCURL_STATICLIB -DLIBSSH_STATIC -DLIBSLIRP_STATIC -DCAIRO_WIN32_STATIC_BUILD'
      clang_extra_cflags: '-Wno-missing-prototypes -Wno-sometimes-uninitialized -Wno-pragma-pack'

    name: ${{ format('🚧 Windows {0} {1} build (ARM64)', matrix.sys, matrix.mode) }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        repository: DF4D3110/qemu
        ref: master

    - name: 'Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p
          python-distlib:p
          nsis:c

    # 关键修复：安装正确的 MinGW Python 和 Meson
    - name: 'Install MinGW Python and Meson'
      run: |
        pacman --noconfirm -S \
          mingw-w64-${{ matrix.arch }}-python \
          mingw-w64-${{ matrix.arch }}-meson \
          mingw-w64-${{ matrix.arch }}-python-packaging

    # 修复 clangarm64 的编译器问题
    - name: 'Setup compiler for clangarm64'
      if: ${{ startsWith(matrix.sys, 'clang') }}
      run: |
        # 确保 clang 可用，并创建 cc 符号链接
        if [ -f "/${{ matrix.sys }}/bin/clang.exe" ]; then
          ln -sf clang.exe /${{ matrix.sys }}/bin/cc.exe
        fi
        # 设置环境变量让 configure 使用正确的编译器
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV

    - name: 'Modify pkgconfig to avoid linker issues'
      if: ${{ matrix.mode == 'static' }}
      run: |
        PKGCONFIG_FILE="/${{ matrix.sys }}/lib/pkgconfig/gpg-error.pc"
        if [ -f "$PKGCONFIG_FILE" ]; then
          sed -i "s#/${{ matrix.sys }}/lib/libintl.dll.a#-llibintl#g" "$PKGCONFIG_FILE"
          sed -i "s#/${{ matrix.sys }}/lib/libiconv.dll.a#-llibiconv#g" "$PKGCONFIG_FILE"
        fi

    - name: 'Verify environment'
      run: |
        echo "=========================================="
        echo "🔍 验证环境"
        echo "=========================================="
        echo ""
        echo "📌 Python 版本:"
        python3 --version
        echo ""
        echo "📌 Meson 版本:"
        meson --version
        echo ""
        echo "📌 Ninja 版本:"
        ninja --version
        echo ""
        echo "📌 编译器信息:"
        if command -v clang &>/dev/null; then
          echo "Clang 版本:"
          clang --version
        fi
        if command -v gcc &>/dev/null; then
          echo "GCC 版本:"
          gcc -dumpmachine
        fi
        echo ""
        echo "📌 PATH:"
        echo $PATH | tr ':' '\n'
        echo ""
        echo "✅ 环境验证完成"

    - name: 'Configure QEMU (${{ matrix.mode }} build)'
      env:
        mode_flags: ${{ matrix.mode == 'dynamic' && env.dynamic_flags || env.static_flags }}
      run: |
        # 构建 extra_cflags
        EXTRA_CFLAGS=""
        if [ "${{ matrix.mode }}" == "static" ]; then
          EXTRA_CFLAGS="$EXTRA_CFLAGS ${{ env.static_extra_cflags }}"
        fi
        if [[ "${{ matrix.sys }}" == clang* ]]; then
          EXTRA_CFLAGS="$EXTRA_CFLAGS ${{ env.clang_extra_cflags }}"
        fi
        
        if [ -n "$EXTRA_CFLAGS" ]; then
          EXTRA_CFLAGS="--extra-cflags=\"$EXTRA_CFLAGS\""
        fi
        
        # 对于 clangarm64，显式指定 CC 和 CXX
        CC_OPTS=""
        if [[ "${{ matrix.sys }}" == clang* ]]; then
          CC_OPTS="--cc=clang --cxx=clang++"
        fi
        
        ./configure --enable-sdl \
                    --enable-fdt=system \
                    --disable-docs \
                    --target-list=arm-softmmu,aarch64-softmmu \
                    --prefix="$(cygpath -u '${{ github.workspace }}')/artifacts" \
                    ${{ env.mode_flags }} \
                    $EXTRA_CFLAGS \
                    $CC_OPTS

    - name: 'Build QEMU'
      run: |
        make -j$(nproc)
        echo "version=v$(cat VERSION)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    # 对于 clangarm64，需要正确的 NSIS 路径
    - name: 'Workaround for clangarm64 nsis'
      if: ${{ startsWith(matrix.sys, 'clang') && matrix.mode == 'dynamic' }}
      run: |
        if [ ! -d "/${{ matrix.sys }}/share/nsis" ] && [ -d "/clang64/share/nsis" ]; then
          ln -s /clang64/share/nsis /${{ matrix.sys }}/share/nsis 2>/dev/null || true
        fi
        if [ ! -f "/${{ matrix.sys }}/etc/nsisconf.nsh" ] && [ -f "/clang64/etc/nsisconf.nsh" ]; then
          ln -s /clang64/etc/nsisconf.nsh /${{ matrix.sys }}/etc/nsisconf.nsh 2>/dev/null || true
        fi
        if [ ! -f "/${{ matrix.sys }}/bin/makensis.exe" ] && [ -f "/clang64/bin/makensis.exe" ]; then
          ln -s /clang64/bin/makensis.exe /${{ matrix.sys }}/bin/makensis.exe 2>/dev/null || true
        fi
        chmod +x /${{ matrix.sys }}/bin/makensis.exe 2>/dev/null || true

    - name: 'Prepare artifacts (static)'
      if: ${{ matrix.mode == 'static' }}
      run: |
        make install

    - name: 'Prepare artifacts (dynamic)'
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
        make installer
        mv -v build/qemu-setup*.exe qemu-setup-${version}.exe

    - name: 'Upload artifact (dynamic)'
      if: ${{ matrix.mode == 'dynamic' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('QEMU {0} Windows ARM64 ({1} build)', env.version, matrix.mode) }}
        path: ${{ github.workspace }}/qemu-setup-${{ env.version }}.exe
        compression-level: 9

    - name: 'Upload artifact (static)'
      if: ${{ matrix.mode == 'static' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('QEMU {0} Windows ARM64 ({1} build)', env.version, matrix.mode) }}
        path: ${{ github.workspace }}/artifacts
        compression-level: 9

    - name: 'Upload logs'
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ format('QEMU {0} Windows ARM64 ({1} build) logs', env.version, matrix.mode) }}
        path: ${{ github.workspace }}/build
        compression-level: 9

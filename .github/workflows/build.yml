name: Build QEMU (gailium119/qemu)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: 🚧 Windows ${{ matrix.sys }} (${{ matrix.mode }} build)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 动态构建
          - os: windows-latest
            sys: mingw64
            mode: dynamic
          # AMD64 静态构建
          - os: windows-latest
            sys: mingw64
            mode: static
          # ARM64 原生动态构建
          - os: windows-11-arm
            sys: clangarm64
            mode: dynamic
          # ARM64 原生静态构建
          - os: windows-11-arm
            sys: clangarm64
            mode: static
    env:
      # 动态构建标志
      dynamic_flags: '--enable-gtk'
      # 静态构建标志
      static_flags: '--disable-gtk --disable-spice --disable-usb-redir --disable-smartcard --disable-gnutls --disable-libssh --disable-vnc-sasl --static'
      static_extra_cflags: '-DCURL_STATICLIB -DLIBSSH_STATIC -DLIBSLIRP_STATIC -DCAIRO_WIN32_STATIC_BUILD'
      # clang 额外 CFLAGS
      clang_extra_cflags: '-Wno-missing-prototypes -Wno-sometimes-uninitialized -Wno-pragma-pack'
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: '🧰 Checkout'
      uses: actions/checkout@main

    - name: 'Setup MSYS2 (${{ matrix.sys }})'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
          python
          python-setuptools
          python-pip
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          gcc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p
          python-distlib:p
          nsis:${{ endsWith(matrix.os, 'arm') && 'c' || 'p' }}

    - name: '修改 pkgconfig 避免静态链接问题'
      if: ${{ matrix.mode == 'static' }}
      run: |
        PKGCONFIG_FILE="/${{ matrix.sys }}/lib/pkgconfig/gpg-error.pc"
        sed -i "s#/${{ matrix.sys }}/lib/libintl.dll.a#-llibintl#g" "$PKGCONFIG_FILE"
        sed -i "s#/${{ matrix.sys }}/lib/libiconv.dll.a#-llibiconv#g" "$PKGCONFIG_FILE"

    - name: '验证 Python 环境'
      run: |
        python3 --version
        python3 -c "import sys; print('Python executable:', sys.executable)"
        python3 -c "import sys; print('Python version:', sys.version)"

    - name: '配置 QEMU (${{ matrix.mode }} 构建)'
      env:
        mode_flags: ${{ matrix.mode == 'dynamic' && env.dynamic_flags || env.static_flags }}
        extra_cflags: ${{ (matrix.mode == 'static' || startsWith(matrix.sys, 'clang')) && format('--extra-cflags="{0} {1}"', matrix.mode == 'static' && env.static_extra_cflags || '', startsWith(matrix.sys, 'clang') && env.clang_extra_cflags || '') || '' }}
      run: |
        ./configure --enable-sdl \
                    --enable-fdt=system \
                    --disable-docs \
                    --target-list=arm-softmmu,aarch64-softmmu \
                    --prefix="$(cygpath -u '${{ github.workspace }}')/artifacts" \
                    ${{ format('{0} {1}', env.mode_flags, env.extra_cflags) }}

    - name: '编译 QEMU'
      run: |
        make -j$(nproc)
        echo "version=v$(cat VERSION)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: 'Workaround for clangarm64 nsis'
      if: ${{ endsWith(matrix.os, 'arm') && matrix.mode == 'dynamic' }}
      run: |
        ln -s /clang64/share/nsis /clangarm64/share/nsis 2>/dev/null || true
        ln -s /clang64/etc/nsisconf.nsh /clangarm64/etc/nsisconf.nsh 2>/dev/null || true
        ln -s /clang64/bin/makensis.exe /clangarm64/bin/makensis.exe 2>/dev/null || true

    - name: '准备产物 (静态构建)'
      if: ${{ matrix.mode == 'static' }}
      run: |
        make install

    - name: '准备产物 (动态构建)'
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
        make installer
        mv -v build/qemu-setup*.exe qemu-setup-${version}.exe

    - name: '上传产物 (动态构建)'
      if: ${{ matrix.mode == 'dynamic' }}
      uses: actions/upload-artifact@main
      with:
        name: ${{ format('QEMU {0} Windows ({1} {2} build)', env.version, matrix.sys, matrix.mode) }}
        path: ${{ github.workspace }}/qemu-setup-${{ env.version }}.exe
        compression-level: 9

    - name: '上传产物 (静态构建)'
      if: ${{ matrix.mode == 'static' }}
      uses: actions/upload-artifact@main
      with:
        name: ${{ format('QEMU {0} Windows ({1} {2} build)', env.version, matrix.sys, matrix.mode) }}
        path: ${{ github.workspace }}/artifacts
        compression-level: 9

    - name: '上传日志 (如果失败)'
      if: ${{ failure() }}
      uses: actions/upload-artifact@main
      with:
        name: ${{ format('QEMU {0} Windows ({1} {2} build) logs', env.version, matrix.sys, matrix.mode) }}
        path: ${{ github.workspace }}/build
        compression-level: 9 
